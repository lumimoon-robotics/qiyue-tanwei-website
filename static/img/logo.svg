<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- 背景圆 — 月亮/科技感 -->
  <circle cx="60" cy="60" r="56" fill="#1a5276"/>
  <circle cx="60" cy="60" r="52" stroke="#3498db" stroke-width="2" opacity="0.6"/>
  <!-- 内圈轨道 -->
  <circle cx="60" cy="60" r="40" stroke="#2ecc71" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7"/>
  <!-- 探微 — 镜头/放大镜图标 -->
  <circle cx="60" cy="58" r="22" stroke="#ecf0f1" stroke-width="2.5" fill="none"/>
  <line x1="76" y1="74" x2="88" y2="86" stroke="#ecf0f1" stroke-width="3" stroke-linecap="round"/>
  <!-- 核心亮点 -->
  <circle cx="60" cy="58" r="6" fill="#2ecc71" opacity="0.9"/>
  <!-- 装饰星点 -->
  <circle cx="34" cy="42" r="2" fill="#f39c12"/>
  <circle cx="82" cy="34" r="1.5" fill="#f39c12"/>
  <circle cx="44" cy="82" r="1.5" fill="#f39c12"/>
</svg>
